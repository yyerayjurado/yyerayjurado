<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Hola, soy Yeray Jurado. Desarrollador Web Full Stack en Jaén">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="0.55" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#DB2777"/>
    </linearGradient>
    <clipPath id="round"><rect width="1280" height="320" rx="24"/></clipPath>
    <style>
      .f1{animation:float 6s ease-in-out infinite}
      .f2{animation:float 8s ease-in-out infinite reverse}
      .f3{animation:float 7s ease-in-out infinite 1s}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
      .t{font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}
      .m{font-family:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
    </style>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <!-- Formas decorativas -->
    <circle class="f1" cx="1180" cy="40" r="120" fill="#FFFFFF" fill-opacity="0.10"/>
    <circle class="f2" cx="760" cy="300" r="90" fill="#FFFFFF" fill-opacity="0.08"/>
    <circle class="f3" cx="40" cy="20" r="60" fill="#FFFFFF" fill-opacity="0.08"/>
    <circle class="f2" cx="1040" cy="270" r="10" fill="#FDE047"/>
    <circle class="f1" cx="700" cy="70" r="8" fill="#FDE047"/>
    <rect class="f3" x="620" y="210" width="18" height="18" rx="4" fill="#FFFFFF" fill-opacity="0.35" transform="rotate(20 629 219)"/>
  </g>

  <!-- Texto -->
  <rect x="72" y="70" width="128" height="36" rx="18" fill="#FFFFFF" fill-opacity="0.18"/>
  <text class="t" x="136" y="94" text-anchor="middle" font-size="16" font-weight="600" fill="#FFFFFF" letter-spacing="1.5">HOLA, SOY</text>
  <text class="t" x="68" y="182" font-size="76" font-weight="800" fill="#FFFFFF" letter-spacing="-2.5">Yeray Jurado</text>
  <text class="t" x="72" y="236" font-size="26" font-weight="500" fill="#FFFFFF" fill-opacity="0.92">Desarrollador Web Full Stack · Jaén</text>

  <!-- Icono de código -->
  <g class="f1">
    <rect x="890" y="88" width="190" height="150" rx="28" fill="#FFFFFF" transform="rotate(-6 985 163)"/>
    <text class="m" x="985" y="186" text-anchor="middle" font-size="64" font-weight="700" fill="#7C3AED" transform="rotate(-6 985 163)">&lt;/&gt;</text>
  </g>
</svg>
